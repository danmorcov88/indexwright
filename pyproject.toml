[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexwright"
dynamic = ["version"]
description = "Read-only performance advisor for self-hosted MongoDB: slow query shapes, ESR index recommendations, index hygiene."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dan Morcov", email = "danmorcov88@gmail.com" }]
keywords = ["mongodb", "index", "performance", "advisor", "profiler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "pymongo>=4.6,<5",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers[mongodb]>=4.8",
  "pre-commit>=3",
]

[project.scripts]
indexwright = "indexwright.cli:app"

[project.urls]
Homepage = "https://github.com/danmorcov88/indexwright"
Changelog = "https://github.com/danmorcov88/indexwright/blob/main/CHANGELOG.md"
Issues = "https://github.com/danmorcov88/indexwright/issues"

[tool.hatch.version]
path = "src/indexwright/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "TCH", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["indexwright"]
